services:
  app:
    build: .
    container_name: sideai-app
    ports:
      - "8080:8080"
    environment:
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - AI_MODEL_URL=${AI_MODEL_URL}
      - AI_MODEL_ENDPOINT=${AI_MODEL_ENDPOINT}
    depends_on:
      - postgres
    networks:
      - sideai-network

  postgres:
    image: postgres:15-alpine
    container_name: sideai-db
    environment:
      - POSTGRES_DB=message_guard
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sideai-network

networks:
  sideai-network:
    driver: bridge

volumes:
  postgres_data:
